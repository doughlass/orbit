name: PR Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  check-issue-link:
    name: Check Issue Link
    if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description for issue link
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            // Check for issue references: "Closes #123", "Fixes #123", "Resolves #123", etc.
            const issuePattern = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*#\d+/gi;
            const hasIssueLink = issuePattern.test(body);

            // Also check for direct issue URL links
            const urlPattern = /github\.com\/[\w-]+\/[\w-]+\/issues\/\d+/gi;
            const hasIssueUrl = urlPattern.test(body);

            if (!hasIssueLink && !hasIssueUrl) {
              core.setFailed(
                '❌ PR must be linked to an issue.\n\n' +
                'Please update your PR description to include one of:\n' +
                '  - "Closes #123"\n' +
                '  - "Fixes #123"\n' +
                '  - "Resolves #123"\n\n' +
                'If there is no existing issue, please create one first.'
              );
            } else {
              console.log('✅ PR is linked to an issue');
            }

  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  # Off for now, not because scanning is unwanted: CodeQL cannot upload results
  # without GitHub Advanced Security, which a private repo on a free plan does
  # not have, so the job fails with "Code scanning is not enabled for this
  # repository". Turn back on if the repo goes public or GHAS is bought.
