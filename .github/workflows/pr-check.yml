name: PR Check

# Inherited from the upstream taws project: the reusable workflow below lives
# under huseyinbabal, so they control what runs here. Replacing it with our own
# jobs is on the list.

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  check:
    uses: huseyinbabal/rust-actions/.github/workflows/pr-check.yml@main
    with:
      check_issue_link: true
      run_tests: true
      run_fmt: true
      run_clippy: true
      # Off for now, not because scanning is unwanted: CodeQL cannot upload
      # results without GitHub Advanced Security, which a private repo on a free
      # plan does not have, so the job fails with "Code scanning is not enabled
      # for this repository". Turn back on if the repo goes public or GHAS is
      # bought.
      run_security_scan: false
