# cargo-audit reads this from the repo root (*.cargo/audit.toml* is in its
# search path) and it holds only the advisory IDs with no released fix, so the
# workflow's `--deny warnings` keeps its teeth. Anything listed here must be
# revisited when its fix lands — tripping this file again means re-check first
# rather than editing it into silence.
#
# Workflow note: this file is not in audit.yml's `paths` trigger; audit runs
# here anyway whenever a PR touches the lockfile, which is the only way these
# entries can change.
[advisories]
ignore = [
    # RUSTSEC-2026-0441 (pin-utils, unmaintained). Only aws-smithy-http 0.64 /
    # aws-smithy-types 1.6 pull it; a newer smitty line that drops it is not
    # semver-compatible with the pinned aws-sdk 1.x crates. Re-check when the
    # SDK major line moves.
    "RUSTSEC-2026-0441",
    # RUSTSEC-2024-0449 (unsafe-libyaml, unmaintained). Its sole parent,
    # serde_yaml 0.9.x, is itself archived upstream ("+deprecated"), so a
    # lockfile bump can never fix it; dropping it means migrating
    # src/config.rs off serde_yaml. Tracked as migration work.
    "RUSTSEC-2024-0449",
]
