[workspace]
# release-plz's own GitHub release is disabled — our release.yml
# (triggered by the tag) handles multi-platform binary builds, the
# GitHub release and Docker images.
git_release_enable = false

# Default tag is "orbit-tui-v1.0.0"; "v*" trigger in release.yml
# needs a bare "v<version>" prefix.
git_tag_name = "v{{ version }}"

publish = true
publish_allow_dirty = true

# Force release even when release-plz thinks nothing changed.
# Remove after the first successful publish.
release_always = true
