[package]
# The crate is orbit-tui because "orbit" is taken on crates.io; the binary is
# still `orbit`. Same split as ripgrep/rg and git-delta/delta.
name = "orbit-tui"
version = "1.1.2"
edition = "2021"
# Real floor, set by the aws-* crates. Not a policy choice; raise it when they do.
rust-version = "1.94.1"
description = "Terminal UI for AWS - navigate, observe, and manage AWS resources"
license = "MIT"
repository = "https://github.com/doughlass/orbit"
homepage = "https://github.com/doughlass/orbit"
readme = "README.md"
keywords = ["aws", "tui", "terminal", "cloud", "infrastructure"]
categories = ["command-line-utilities", "development-tools"]
authors = ["doughlass"]

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"

# AWS (lightweight - SigV4 only, no SDK)
aws-sigv4 = "1.2"
aws-credential-types = "1.2"
aws-smithy-runtime-api = "1.2"

# HTTP client (using rustls to avoid OpenSSL cross-compilation issues)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
url = "2.5"
urlencoding = "2.1"

# Async runtime
tokio = { version = "1.49", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# XML parsing (for EC2, IAM, RDS Query protocol APIs)
quick-xml = { version = "0.41", features = ["serialize"] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Utils
anyhow = "1.0"
thiserror = "2.0"
dirs = "6.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha1 = "0.11"
sha2 = "0.11"
open = "5.3"
hex = "0.4"
fuzzy-matcher = "0.3.7"
async-trait = "0.1.89"
arboard = "3.6"

[dev-dependencies]
dirs = "6.0"
tempfile = "3.24.0"
